<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - Discover Your Next Favorite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --accent-red: #e50914;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --card-bg: #1a1a1a;
            --overlay-bg: rgba(0, 0, 0, 0.92);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Background Gradient Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(229, 9, 20, 0.05) 0%, transparent 50%);
            animation: gradientShift 20s ease infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, 5%) rotate(120deg); }
            66% { transform: translate(-5%, 5%) rotate(240deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            animation: fadeInLeft 0.8s ease;
        }

        .nav {
            display: flex;
            gap: 2rem;
            align-items: center;
            animation: fadeInRight 0.8s ease;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-red);
            transition: width 0.3s ease;
        }

        .nav a:hover {
            color: var(--text-primary);
        }

        .nav a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 8rem 2rem 4rem;
            animation: fadeInUp 1s ease;
        }

        .hero h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: 3px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease 0.2s backwards;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .hero h1::before,
        .hero h1::after {
            content: '';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            background: var(--accent-red);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: bounce 2s ease infinite;
        }

        .hero h1::before {
            content: '\f008';
        }

        .hero h1::after {
            content: '\f008';
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 3rem;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        /* Search Section */
        .search-container {
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .search-wrapper {
            display: flex;
            gap: 1rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .search-wrapper:focus-within {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.1);
        }

        .search-dropdown {
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        .search-dropdown:focus {
            outline: none;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
        }

        .search-input:focus {
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.25rem;
            pointer-events: none;
        }

        .search-results {
            max-width: 1400px;
            margin: 2rem auto 0;
            padding: 2rem;
            display: none;
            animation: fadeInUp 0.4s ease;
        }

        .search-results.active {
            display: block;
        }

        .search-results-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-results-header::before {
            content: '';
            width: 5px;
            height: 40px;
            background: var(--accent-red);
            border-radius: 3px;
        }

        .search-results-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0;
        }

        .search-query {
            color: var(--accent-red);
        }

        .search-results-count {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-left: 0;
        }

        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .result-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--card-bg);
        }

        .result-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
        }

        .result-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .result-item:hover .result-poster {
            transform: scale(1.1);
        }

        .result-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .result-item:hover .result-overlay {
            transform: translateY(0);
        }

        .result-info h3 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .result-info p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .result-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            background: rgba(229, 9, 20, 0.2);
            color: var(--accent-red);
            font-weight: 600;
        }

        .result-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 600;
        }

        .result-rating i {
            color: #ffd700;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        /* Video Player Modal */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .video-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .video-modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 2rem;
            max-width: 1200px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-modal.active .video-modal-content {
            transform: scale(1);
        }

        .video-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .video-modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0;
        }

        .close-video-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-video-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .video-player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .season-episode-selector {
            margin-top: 1.5rem;
            display: none;
        }

        .season-episode-selector.active {
            display: block;
        }

        .selector-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .selector-label {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }

        .season-select,
        .episode-select {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-primary);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .season-select:focus,
        .episode-select:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .season-select option,
        .episode-select option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* Trending Section */
        .trending-section {
            padding: 4rem 0;
            animation: fadeInUp 1.2s ease;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-header::before {
            content: '';
            width: 5px;
            height: 40px;
            background: var(--accent-red);
            border-radius: 3px;
        }

        .section-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-left: auto;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }

        .movie-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--card-bg);
            animation: fadeInUp 0.6s ease backwards;
        }

        .movie-card:nth-child(1) { animation-delay: 0.1s; }
        .movie-card:nth-child(2) { animation-delay: 0.2s; }
        .movie-card:nth-child(3) { animation-delay: 0.3s; }
        .movie-card:nth-child(4) { animation-delay: 0.4s; }
        .movie-card:nth-child(5) { animation-delay: 0.5s; }
        .movie-card:nth-child(6) { animation-delay: 0.6s; }
        .movie-card:nth-child(7) { animation-delay: 0.7s; }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.1);
        }

        .movie-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .movie-card:hover .movie-overlay {
            transform: translateY(0);
        }

        .movie-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 600;
        }

        .rating i {
            color: #ffd700;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav {
                gap: 1rem;
            }

            .nav a {
                font-size: 0.875rem;
            }

            .hero {
                padding: 4rem 1rem 2rem;
            }

            .search-container {
                padding: 0 1rem;
            }

            .search-wrapper {
                flex-direction: column;
                gap: 0.5rem;
            }

            .search-dropdown {
                width: 100%;
                min-width: auto;
            }

            .search-results {
                padding: 1rem;
            }

            .search-results-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            header {
                padding: 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .movies-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-results-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .section-header h2 {
                font-size: 1.75rem;
            }

            .search-results-header h2 {
                font-size: 1.5rem;
            }

            .results-count {
                display: none;
            }

            .search-results {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span>Video</span>
        </div>
        <nav class="nav">
            <a href="#home"><i class="fas fa-home"></i> Home</a>
            <!-- <a href="#api"><i class="fas fa-code"></i> API</a>
            <a href="#browse"><i class="fas fa-th"></i> Browse</a> -->
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Discover Your Next Favorite</h1>
            <p>Search through thousands of movies, TV shows, and anime series</p>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <select class="search-dropdown" id="searchType">
                        <option value="multi">Movies & TV Shows</option>
                        <option value="movie">Movies</option>
                        <option value="tv">TV Shows</option>
                    </select>
                    <div class="search-input-wrapper">
                        <input 
                            type="text" 
                            class="search-input" 
                            id="searchInput" 
                            placeholder="Type here to search..."
                            autocomplete="off"
                        >
                        <i class="fas fa-search search-icon"></i>
                    </div>
                </div>
            </div>
        </section>

        <div class="search-results" id="searchResults"></div>

        <div class="container">
            <section class="trending-section">
                <div class="section-header">
                    <h2>Trending Today</h2>
                    <span class="results-count" id="resultsCount">Loading...</span>
                </div>
                <div class="movies-grid" id="moviesGrid">
                    <div class="loading">Loading trending content...</div>
                </div>
            </section>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <div class="video-modal-header">
                <h2 class="video-modal-title" id="videoModalTitle">Play Video</h2>
                <button class="close-video-btn" onclick="closeVideoPlayer()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="video-player-container" id="videoPlayerContainer">
                <iframe id="videoPlayer" allowfullscreen></iframe>
            </div>
            <div class="season-episode-selector" id="seasonEpisodeSelector">
                <div class="selector-row">
                    <div style="flex: 1;">
                        <label class="selector-label">Season</label>
                        <select class="season-select" id="seasonSelect" onchange="updateEpisodes()">
                            <option value="1">Season 1</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label class="selector-label">Episode</label>
                        <select class="episode-select" id="episodeSelect" onchange="updateVideoPlayer()">
                            <option value="1">Episode 1</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        sessionStorage.setItem('ads-enabled-session', 'false');

        const API_BASE = 'https://db.videasy.net/3';
        const IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
        const VIDEO_EMBED_BASE = 'https://www.vidking.net/embed';
        let searchTimeout;
        let currentMediaType = '';
        let currentMediaId = '';
        let currentMediaTitle = '';

        // AJAX helper function using fetch
        async function ajaxRequest(url) {
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('AJAX request failed:', error);
                throw error;
            }
        }

        // Video Player Functions
        function openVideoPlayer(mediaType, mediaId, title) {
            currentMediaType = mediaType;
            currentMediaId = mediaId;
            currentMediaTitle = title;
            
            const modal = document.getElementById('videoModal');
            const modalTitle = document.getElementById('videoModalTitle');
            const seasonSelector = document.getElementById('seasonEpisodeSelector');
            const videoPlayer = document.getElementById('videoPlayer');
            
            modalTitle.textContent = title;
            modal.classList.add('active');
            
            if (mediaType === 'tv') {
                // For TV shows, show season/episode selector and load season data
                seasonSelector.classList.add('active');
                loadSeasons(mediaId);
            } else {
                // For movies, hide selector and load video directly
                seasonSelector.classList.remove('active');
                const embedUrl = `${VIDEO_EMBED_BASE}/movie/${mediaId}`;
                videoPlayer.src = embedUrl;
            }
        }

        function closeVideoPlayer() {
            const modal = document.getElementById('videoModal');
            const videoPlayer = document.getElementById('videoPlayer');
            modal.classList.remove('active');
            videoPlayer.src = '';
            currentMediaType = '';
            currentMediaId = '';
            currentMediaTitle = '';
        }

        // Load seasons for TV show
        async function loadSeasons(tvId) {
            try {
                const data = await ajaxRequest(`${API_BASE}/tv/${tvId}?language=en`);
                const seasonSelect = document.getElementById('seasonSelect');
                
                // Populate season selector
                seasonSelect.innerHTML = data.seasons
                    .filter(season => season.season_number > 0) // Exclude specials
                    .map(season => `<option value="${season.season_number}">Season ${season.season_number}</option>`)
                    .join('');
                
                // Load episodes for first season
                updateEpisodes();
            } catch (error) {
                console.error('Error loading seasons:', error);
            }
        }

        // Update episodes when season changes
        async function updateEpisodes() {
            const seasonNumber = document.getElementById('seasonSelect').value;
            const episodeSelect = document.getElementById('episodeSelect');
            
            try {
                const data = await ajaxRequest(`${API_BASE}/tv/${currentMediaId}/season/${seasonNumber}?language=en`);
                
                // Populate episode selector
                episodeSelect.innerHTML = data.episodes
                    .map(episode => `<option value="${episode.episode_number}">Episode ${episode.episode_number} - ${episode.name}</option>`)
                    .join('');
                
                // Load first episode
                updateVideoPlayer();
            } catch (error) {
                console.error('Error loading episodes:', error);
            }
        }

        // Update video player when season/episode changes
        function updateVideoPlayer() {
            const seasonNumber = document.getElementById('seasonSelect').value;
            const episodeNumber = document.getElementById('episodeSelect').value;
            const videoPlayer = document.getElementById('videoPlayer');
            
            const embedUrl = `${VIDEO_EMBED_BASE}/tv/${currentMediaId}/${seasonNumber}/${episodeNumber}`;
            videoPlayer.src = embedUrl;
        }

        // Add click handlers to movie cards
        function addMovieCardClickHandlers() {
            document.querySelectorAll('.movie-card').forEach(card => {
                card.addEventListener('click', function() {
                    const mediaType = this.dataset.mediaType;
                    const mediaId = this.dataset.mediaId;
                    // Navigate to detail page for both movies and TV shows
                    window.location.href = `movie-detail.html?id=${mediaId}&type=${mediaType}`;
                });
            });
        }

        // Add click handlers to search result cards
        function addResultCardClickHandlers() {
            document.querySelectorAll('.result-item').forEach(card => {
                card.addEventListener('click', function() {
                    const mediaType = this.dataset.mediaType;
                    const mediaId = this.dataset.mediaId;
                    // Navigate to detail page for both movies and TV shows
                    window.location.href = `movie-detail.html?id=${mediaId}&type=${mediaType}`;
                });
            });
        }

        // Load trending content
        async function loadTrending() {
            try {
                const data = await ajaxRequest(`${API_BASE}/trending/all/day?region=US&language=en`);
                
                document.getElementById('resultsCount').textContent = `${data.results.length} results found`;
                
                const moviesGrid = document.getElementById('moviesGrid');
                moviesGrid.innerHTML = data.results.map(item => `
                    <div class="movie-card" 
                         data-media-type="${item.media_type}" 
                         data-media-id="${item.id}"
                         data-title="${(item.title || item.name).replace(/"/g, '&quot;')}">
                        <img 
                            src="${item.poster_path ? IMAGE_BASE + item.poster_path : 'https://via.placeholder.com/300x450?text=No+Image'}" 
                            alt="${item.title || item.name}"
                            class="movie-poster"
                            onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'"
                        >
                        <div class="movie-overlay">
                            <div class="movie-title">${item.title || item.name}</div>
                            <div class="movie-meta">
                                <span class="badge">${item.media_type.toUpperCase()}</span>
                                <span class="rating"><i class="fas fa-star"></i> ${item.vote_average.toFixed(1)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                // Add click handlers after rendering
                addMovieCardClickHandlers();
            } catch (error) {
                console.error('Error loading trending:', error);
                document.getElementById('moviesGrid').innerHTML = '<div class="loading">Failed to load content</div>';
            }
        }

        // Search functionality with AJAX
        async function performSearch(query) {
            const resultsContainer = document.getElementById('searchResults');
            const trendingSection = document.querySelector('.trending-section');
            
            if (!query.trim()) {
                resultsContainer.classList.remove('active');
                resultsContainer.innerHTML = '';
                if (trendingSection) trendingSection.style.display = 'block';
                return;
            }

            const searchType = document.getElementById('searchType').value;
            resultsContainer.classList.add('active');
            if (trendingSection) trendingSection.style.display = 'none';
            
            resultsContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';

            try {
                const data = await ajaxRequest(`${API_BASE}/search/${searchType}?language=en&page=1&query=${encodeURIComponent(query)}`);

                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<div class="loading"><i class="fas fa-exclamation-circle"></i> No results found</div>';
                    return;
                }

                const mediaTypeForAll = searchType === 'movie' ? 'movie' : (searchType === 'tv' ? 'tv' : null);

                resultsContainer.innerHTML = `
                    <div class="search-results-header">
                        <h2>Search Results for <span class="search-query">"${query}"</span></h2>
                    </div>
                    <div class="search-results-count">${data.results.length} results found</div>
                    <div class="search-results-grid">
                        ${data.results.map(item => {
                            const itemMediaType = mediaTypeForAll || item.media_type;
                            return `
                            <div class="result-item"
                                 data-media-type="${itemMediaType}" 
                                 data-media-id="${item.id}"
                                 data-title="${(item.title || item.name).replace(/"/g, '&quot;')}">
                                <img 
                                    src="${item.poster_path ? IMAGE_BASE + item.poster_path : 'https://via.placeholder.com/300x450?text=No+Image'}" 
                                    alt="${item.title || item.name}"
                                    class="result-poster"
                                    onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'"
                                >
                                <div class="result-overlay">
                                    <div class="result-info">
                                        <h3>${item.title || item.name}</h3>
                                        ${item.overview ? `<p>${item.overview}</p>` : ''}
                                        <div class="result-meta">
                                            <span class="badge"><i class="fas fa-film"></i> ${itemMediaType.toUpperCase()}</span>
                                            ${item.vote_average ? `<span class="result-rating"><i class="fas fa-star"></i> ${item.vote_average.toFixed(1)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                `;
                
                // Add click handlers after rendering
                addResultCardClickHandlers();
            } catch (error) {
                console.error('Error searching:', error);
                resultsContainer.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle"></i> Search failed. Please try again.</div>';
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSearch(e.target.value);
            }, 500);
        });

        document.getElementById('searchType').addEventListener('change', () => {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) {
                performSearch(query);
            }
        });

        // Close modal on outside click
        document.getElementById('videoModal').addEventListener('click', (e) => {
            if (e.target.id === 'videoModal') {
                closeVideoPlayer();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeVideoPlayer();
            }
        });

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadTrending);
        } else {
            loadTrending();
        }
    </script>
</body>
</html>
